<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Protected access — S. HIADSI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260804en" />
  <link rel="stylesheet" href="css/login.css?v=20260804en" />
</head>
<body class="login-page">
  <div class="bg-atmosphere" aria-hidden="true"></div>
  <div class="bg-lattice" aria-hidden="true"></div>

  <main class="login-wrap">
    <p class="login-brand">S. HIADSI</p>
    <h1>Restricted access</h1>
    <p class="login-text">
      These interfaces are protected. A password is required
      to browse and download — without authorization, there is no access or modification.
    </p>

    <form class="login-form" method="post" action="/login" autocomplete="current-password">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        autofocus
        placeholder="Your password"
      />
      <button class="btn btn-primary" type="submit">Enter</button>
    </form>

    <p id="login-error" class="login-error" hidden>Incorrect password.</p>
    <p class="login-note">Contact Prof. S. HIADSI (LMESM / USTO-MB, Oran) to request access.</p>
  </main>

  <script>
    if (new URLSearchParams(location.search).get("error") === "1") {
      const el = document.getElementById("login-error");
      el.hidden = false;
    }
  </script>
</body>
</html>

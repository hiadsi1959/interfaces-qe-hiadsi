<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test_Pseudos - Compact</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c1612;--teal:#128570;--paper:#f3f6f2;--line:rgba(26,36,32,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
.top{background:linear-gradient(165deg,#0e5a4c,#128570);color:#fff;padding:1rem}
.brand{font-family:Fraunces,serif;font-size:2.5rem;margin:0}
.nav{display:flex;gap:.5rem;padding:.5rem 1rem;background:#128570;position:sticky;top:0}
.nav a{color:#000;background:#fff;padding:.4rem .8rem;border-radius:20px;text-decoration:none;font-weight:700}
.panel{max-width:1100px;margin:1.5rem auto;background:#fff;padding:1.5rem;border-radius:10px;border:1px solid var(--line)}
.btn{padding:.5rem 1rem;border-radius:8px;border:1px solid var(--line);cursor:pointer;font-weight:600}
.btn.primary{background:var(--teal);color:#fff}
</style>
</head>
<body>
<header class="top">
<h1 class="brand">Test_Pseudos</h1>
<p>Interface compactée de validation UPF Quantum ESPRESSO</p>
</header>
<nav class="nav">
<a href="#accueil">Accueil</a>
<a href="#test">Tests</a>
<a href="#valides">Validés</a>
<a href="#guide">Guide</a>
</nav>
<main>
<section id="accueil" class="panel"><h2>Accueil</h2><p>Validation automatisée de pseudopotentiels UPF</p></section>
<section id="test" class="panel"><h2>Tests</h2><button class="btn primary">Lancer tests</button></section>
<section id="valides" class="panel"><h2>Pseudos validés</h2></section>
<section id="guide" class="panel"><h2>Guide</h2></section>
</main>
<footer style="text-align:center;padding:2rem;color:#666">Test Pseudos - Interface Compactée</footer>
<script>
document.querySelectorAll('.nav a').forEach(a=>{a.onclick=e=>{e.preventDefault();document.querySelectorAll('section').forEach(s=>s.style.display='none');document.getElementById(a.href.split('#')[1]).style.display='block'}});
document.querySelectorAll('section').forEach((s,i)=>s.style.display=i===0?'block':'none');
</script>
</body>
</html>
